name: Beepy Action Failure Triage

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
      - Curator Scout
      - Beepy Blog Agent
      - Beepy Manager
      - Beepy PR Review
    types: [completed]

concurrency:
  group: beepy-action-failure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_PROVIDER: kimi-for-coding
      KIMI_MODEL: k2p7
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCOUT_AGENT_TIMEOUT_MS: "300000"
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      FAILED_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
      FAILED_EVENT: ${{ github.event.workflow_run.event }}
      FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout failed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Beepy automation failure directly
        if: ${{ env.FAILED_WORKFLOW_NAME == 'Beepy Manager' || env.FAILED_WORKFLOW_NAME == 'Beepy PR Review' }}
        env:
          TRIAGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create beepy --color 2f81f7 --description "Automated Beepy work" || true
          gh label create qa --color d29922 --description "Quality assurance" || true
          gh label create actions --color 8957e5 --description "GitHub Actions and automation" || true

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          The ${FAILED_WORKFLOW_NAME} workflow failed.

          Failed run: ${FAILED_RUN_URL}
          Failed head: ${FAILED_HEAD_BRANCH} @ ${FAILED_HEAD_SHA}
          Triage run: ${TRIAGE_RUN_URL}

          Beepy model-agent workflow failures are reported directly instead of launching another model-powered triage session. These failures are commonly model timeouts, and running a second agent to diagnose that can waste another full timeout window without producing a useful trace.
          EOF

          issue_number="$(gh issue list --state open --search "${FAILED_WORKFLOW_NAME} workflow failed in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "${FAILED_WORKFLOW_NAME} workflow failed" --body-file "$body_file" --label beepy --label qa --label actions
          fi

      - name: Setup Bun
        if: ${{ env.FAILED_WORKFLOW_NAME != 'Beepy Manager' && env.FAILED_WORKFLOW_NAME != 'Beepy PR Review' }}
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        if: ${{ env.FAILED_WORKFLOW_NAME != 'Beepy Manager' && env.FAILED_WORKFLOW_NAME != 'Beepy PR Review' }}
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        if: ${{ env.FAILED_WORKFLOW_NAME != 'Beepy Manager' && env.FAILED_WORKFLOW_NAME != 'Beepy PR Review' }}
        run: bun install --frozen-lockfile

      - name: Run Beepy action-failure triage
        if: ${{ env.FAILED_WORKFLOW_NAME != 'Beepy Manager' && env.FAILED_WORKFLOW_NAME != 'Beepy PR Review' }}
        id: triage_run
        continue-on-error: true
        run: bun run beepy:action-failure

      - name: Show triage changes
        if: ${{ always() }}
        run: git status --short

      - name: Upload triage trace
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beepy-action-failure-trace
          path: potential/runs/*.action-failure.md

      - name: Report triage failure
        if: ${{ steps.triage_run.outcome == 'failure' && env.FAILED_WORKFLOW_NAME != 'Beepy Manager' && env.FAILED_WORKFLOW_NAME != 'Beepy PR Review' }}
        env:
          TRIAGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create beepy --color 2f81f7 --description "Automated Beepy work" || true
          gh label create qa --color d29922 --description "Quality assurance" || true
          gh label create actions --color 8957e5 --description "GitHub Actions and automation" || true

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          The Beepy action-failure triage workflow failed while handling another failed workflow run.

          Failed workflow: ${FAILED_WORKFLOW_NAME}
          Failed run: ${FAILED_RUN_URL}
          Failed head: ${FAILED_HEAD_BRANCH} @ ${FAILED_HEAD_SHA}
          Triage run: ${TRIAGE_RUN_URL}

          The trace artifact is attached to the triage run when available. This fallback issue was created so a triage-agent timeout or crash does not make the triage workflow itself the only signal.
          EOF

          issue_number="$(gh issue list --state open --search "triage failed ${FAILED_RUN_ID} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "Beepy action failure triage failed for run ${FAILED_RUN_ID}" --body-file "$body_file" --label beepy --label qa --label actions
          fi

      - name: Create autofix pull request
        if: ${{ steps.triage_run.outcome == 'success' && env.FAILED_WORKFLOW_NAME != 'Beepy Manager' && env.FAILED_WORKFLOW_NAME != 'Beepy PR Review' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.workflow_run.head_branch }}
          branch: beepy-action-failure/${{ github.event.workflow_run.id }}
          delete-branch: true
          commit-message: Fix Beepy-detected action failure
          title: "Beepy action failure fix: ${{ github.event.workflow_run.name }} #${{ github.event.workflow_run.id }}"
          body: |
            Automated Beepy triage for a failed GitHub Actions run.

            Failed run: ${{ github.event.workflow_run.html_url }}
            Workflow: `${{ github.event.workflow_run.name }}`
            Head: `${{ github.event.workflow_run.head_branch }}` at `${{ github.event.workflow_run.head_sha }}`

            Review the action log and generated changes before merging.
          add-paths: |
            .github
            assets
            docs
            package.json
            scripts
            src
            tsconfig.json
