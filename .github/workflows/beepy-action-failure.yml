name: Beepy Action Failure Triage

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
      - Curator Scout
      - Beepy Blog Agent
      - Beepy Manager
      - Beepy PR Review
    types: [completed]

concurrency:
  group: beepy-action-failure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      FAILED_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
      FAILED_EVENT: ${{ github.event.workflow_run.event }}
      FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout failed head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run deterministic recovery
        run: bun run beepy:action-failure:auto

      - name: Show recovery changes
        if: ${{ always() }}
        run: git status --short

      - name: Upload recovery trace
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beepy-action-failure-trace
          path: potential/runs/*.action-failure.md
          retention-days: 1
