name: Curator Scout

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Research topic for the scout run
        required: true
        default: obscure HCI hardware 1976-1992
      discovery_count:
        description: Number of broad candidates to ask Grok for
        required: true
        default: "12"
      candidate_limit:
        description: Number of de-duped candidates to research end-to-end
        required: true
        default: "4"
      target_count:
        description: Approximate number of objects Beepy should select
        required: true
        default: "4"
      research_concurrency:
        description: Parallel candidate research jobs
        required: true
        default: "3"
      eval_concurrency:
        description: Parallel eval jobs
        required: true
        default: "4"
      agent_timeout_ms:
        description: Max time for one opencode/model call
        required: true
        default: "180000"
      candidate_timeout_ms:
        description: Max time for one candidate research/download job
        required: true
        default: "300000"
      fetch_timeout_ms:
        description: Max time for one Exa/Wikipedia/page/image fetch
        required: true
        default: "20000"
      run_eval:
        description: Run LLM eval after scout
        required: true
        type: boolean
        default: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROK_MODEL: grok-4.3
      DEEPSEEK_MODEL: deepseek-v4-pro
      OPENROUTER_MODEL: z-ai/glm-5.2
      SCOUT_DISCOVERY_COUNT: ${{ inputs.discovery_count }}
      SCOUT_CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
      SCOUT_TARGET_COUNT: ${{ inputs.target_count }}
      SCOUT_RESEARCH_CONCURRENCY: ${{ inputs.research_concurrency }}
      SCOUT_EVAL_CONCURRENCY: ${{ inputs.eval_concurrency }}
      SCOUT_AGENT_TIMEOUT_MS: ${{ inputs.agent_timeout_ms }}
      SCOUT_CANDIDATE_TIMEOUT_MS: ${{ inputs.candidate_timeout_ms }}
      SCOUT_FETCH_TIMEOUT_MS: ${{ inputs.fetch_timeout_ms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run curator scout
        run: bun run scout -- "${{ inputs.topic }}"

      - name: Run scout eval
        if: ${{ inputs.run_eval }}
        run: bun run scout:eval

      - name: Build site with generated notes
        run: bun run build

      - name: Upload scout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curator-scout-output
          path: |
            potential/
            docs/blog/
            public/
