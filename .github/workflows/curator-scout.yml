name: Curator Scout

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Research topic for the scout run
        required: true
        default: research, review, and add about 3 more weird HCI interface artifacts from 1976-1992
      agent_timeout_ms:
        description: Max time for the opencode agent run
        required: true
        default: "600000"
      create_pr:
        description: Open a PR with generated scout output
        required: true
        type: boolean
        default: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROK_MODEL: grok-4.3
      DEEPSEEK_MODEL: deepseek-v4-pro
      OPENROUTER_MODEL: z-ai/glm-5.2
      SCOUT_AGENT_TIMEOUT_MS: ${{ inputs.agent_timeout_ms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run curator scout
        run: bun run scout -- "${{ inputs.topic }}"

      - name: Typecheck generated collection
        run: bun run typecheck

      - name: Build site with generated notes
        run: bun run build

      - name: Show generated changes
        run: git status --short

      - name: Upload scout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curator-scout-output
          path: |
            assets/wiki/
            docs/beepy-memory.md
            docs/hci-wiki.md
            potential/
            docs/blog/
            src/data.ts
            public/

      - name: Create scout output pull request
        if: ${{ inputs.create_pr }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: curator-scout/${{ github.run_id }}
          delete-branch: true
          commit-message: Add curator scout output
          title: "Curator scout: ${{ inputs.topic }}"
          body: |
            Automated curator scout output for `${{ inputs.topic }}`.

            Review the generated Field Notes and potential research bundles before merging.
          add-paths: |
            assets/wiki
            docs/beepy-memory.md
            docs/blog
            docs/hci-wiki.md
            potential
            src/data.ts
