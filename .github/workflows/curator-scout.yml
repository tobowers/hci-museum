name: Curator Scout

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: Research topic for the scout run
        required: true
        default: research, review, and add about 3 more weird HCI interface artifacts from 1976-1992
      agent_timeout_ms:
        description: Max time for the opencode agent run
        required: true
        default: "1800000"
      create_pr:
        description: Open a PR with generated scout output
        required: true
        type: boolean
        default: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OCTEN_API_KEY: ${{ secrets.OCTEN_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROK_MODEL: grok-4.3
      DEEPSEEK_MODEL: deepseek-v4-pro
      OPENROUTER_MODEL: z-ai/glm-5.2
      SCOUT_AGENT_TIMEOUT_MS: ${{ inputs.agent_timeout_ms || '1800000' }}
      # Broad search can fan out internally, so cap the generated subqueries
      # across every agent in the run.
      OCTEN_MAX_QUERIES_PER_RUN: "12"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Octen spend guard
        run: bun test scripts/octen-client.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Run curator scout
        id: scout_run
        continue-on-error: true
        env:
          SCOUT_TOPIC: ${{ inputs.topic || 'research, review, and add about 3 more weird HCI interface artifacts from 1976-1992' }}
        run: bun run scout -- "$SCOUT_TOPIC"

      - name: Typecheck generated collection
        if: ${{ steps.scout_run.outcome == 'success' }}
        run: bun run typecheck

      - name: Build site with generated notes
        if: ${{ steps.scout_run.outcome == 'success' }}
        run: bun run build

      - name: Show generated changes
        if: ${{ always() }}
        run: git status --short

      - name: Create scout output pull request
        if: ${{ (github.event_name == 'schedule' || inputs.create_pr) && steps.scout_run.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: curator-scout/${{ github.run_id }}
          delete-branch: true
          commit-message: Add curator scout output
          title: "Curator scout: ${{ inputs.topic || 'scheduled collection run' }}"
          body: |
            Automated curator scout output for `${{ inputs.topic || 'scheduled collection run' }}`.

            Review the generated Field Notes and potential research bundles before merging.
          add-paths: |
            assets/wiki
            docs/beepy-memory.md
            docs/blog
            docs/hci-wiki.md
            potential
            src/data.ts

      - name: Fail if scout failed
        if: ${{ steps.scout_run.outcome != 'success' }}
        run: exit 1
