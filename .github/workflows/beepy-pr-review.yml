name: Beepy PR Review

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review. Leave blank to review the oldest open Beepy PR.
        required: false

concurrency:
  group: beepy-pr-review-${{ github.event.pull_request.number || 'queue' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        run: git fetch origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic Beepy PR review
        run: bun run beepy:pr-review:auto

      - name: Show final git state
        if: ${{ always() }}
        run: git status --short --branch

      - name: Upload review trace
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beepy-pr-review-trace
          path: potential/runs/*.pr-review.md
          retention-days: 1

  review-open-beepy-pr:
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Beepy PR
        id: resolve_pr
        env:
          REQUESTED_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          number="$REQUESTED_PR_NUMBER"
          if [ -z "$number" ]; then
            number="$(gh pr list --state open --limit 30 --json number,author,isDraft,reviewDecision,labels,createdAt --jq '[.[] | select(.author.login == "app/github-actions" and (.isDraft | not) and (.reviewDecision != "APPROVED") and ((.labels | map(.name) | index("needs-human")) | not))] | sort_by(.createdAt) | .[0].number // ""')"
          fi

          if [ -z "$number" ]; then
            echo "No open Beepy PR needs review."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$number" =~ ^[0-9]+$ ]] || fail "PR number must contain digits only."

          metadata="$(gh pr view "$number" --json title,url,author,baseRefName,headRefName,headRefOid,headRepository)"
          head_repo="$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR #$number comes from $head_repo, not $GITHUB_REPOSITORY; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_url="$(jq -r '.url' <<< "$metadata")"
          pr_author="$(jq -r '.author.login' <<< "$metadata")"
          base_ref="$(jq -r '.baseRefName' <<< "$metadata")"
          head_ref="$(jq -r '.headRefName' <<< "$metadata")"
          head_sha="$(jq -r '.headRefOid' <<< "$metadata")"
          title_b64="$(jq -r '.title | @base64' <<< "$metadata")"

          [ "$pr_url" = "https://github.com/${GITHUB_REPOSITORY}/pull/${number}" ] || fail "Unexpected PR URL."
          [ "$pr_author" = "app/github-actions" ] || fail "Only GitHub Actions-authored PRs may enter automated review."
          [[ "$base_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || fail "Unsafe base branch name."
          [[ "$head_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || fail "Unsafe head branch name."
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || fail "Unsafe head commit SHA."
          [[ "$title_b64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]] || fail "Could not safely encode PR title."

          {
            echo "found=true"
            echo "number=$number"
            echo "title_b64=$title_b64"
            echo "url=$pr_url"
            echo "author=$pr_author"
            echo "base_ref=$base_ref"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "head_repo=$head_repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        env:
          PR_BASE_REF: ${{ steps.resolve_pr.outputs.base_ref }}
          PR_HEAD_REF: ${{ steps.resolve_pr.outputs.head_ref }}
        run: |
          git fetch origin "${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}" "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          git checkout -B "$PR_HEAD_REF" "refs/remotes/origin/$PR_HEAD_REF"

      - name: Setup git identity
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: bun install --frozen-lockfile

      - name: Run deterministic Beepy PR review
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        env:
          PR_NUMBER: ${{ steps.resolve_pr.outputs.number }}
          PR_TITLE_B64: ${{ steps.resolve_pr.outputs.title_b64 }}
          PR_URL: ${{ steps.resolve_pr.outputs.url }}
          PR_AUTHOR: ${{ steps.resolve_pr.outputs.author }}
          PR_BASE_REF: ${{ steps.resolve_pr.outputs.base_ref }}
          PR_HEAD_REF: ${{ steps.resolve_pr.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.resolve_pr.outputs.head_sha }}
          PR_HEAD_REPO: ${{ steps.resolve_pr.outputs.head_repo }}
        run: bun run beepy:pr-review:auto

      - name: Show final git state
        if: ${{ always() }}
        run: git status --short --branch

      - name: Upload review trace
        if: ${{ always() && steps.resolve_pr.outputs.found == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beepy-pr-review-trace
          path: potential/runs/*.pr-review.md
          retention-days: 1
