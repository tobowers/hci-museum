name: Beepy PR Review

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review. Leave blank to review the oldest open Beepy PR.
        required: false

concurrency:
  group: beepy-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        run: git fetch origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic Beepy PR review
        run: bun run beepy:pr-review:auto

      - name: Show final git state
        if: ${{ always() }}
        run: git status --short --branch

      - name: Upload review trace
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: beepy-pr-review-trace
          path: potential/runs/*.pr-review.md
          retention-days: 1

  review-open-beepy-pr:
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Beepy PR
        id: resolve_pr
        run: |
          number="${{ inputs.pr_number }}"
          if [ -z "$number" ]; then
            number="$(gh pr list --state open --limit 30 --json number,author,isDraft,reviewDecision,labels,createdAt --jq '[.[] | select(.author.login == "app/github-actions" and (.isDraft | not) and (.reviewDecision != "APPROVED") and ((.labels | map(.name) | index("needs-human")) | not))] | sort_by(.createdAt) | .[0].number // ""')"
          fi

          if [ -z "$number" ]; then
            echo "No open Beepy PR needs review."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_repo="$(gh pr view "$number" --json headRepository --jq '.headRepository.nameWithOwner')"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR #$number comes from $head_repo, not $GITHUB_REPOSITORY; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"
          echo "PR_TITLE=$(gh pr view "$number" --json title --jq '.title')" >> "$GITHUB_ENV"
          echo "PR_URL=$(gh pr view "$number" --json url --jq '.url')" >> "$GITHUB_ENV"
          echo "PR_AUTHOR=$(gh pr view "$number" --json author --jq '.author.login')" >> "$GITHUB_ENV"
          echo "PR_BASE_REF=$(gh pr view "$number" --json baseRefName --jq '.baseRefName')" >> "$GITHUB_ENV"
          echo "PR_HEAD_REF=$(gh pr view "$number" --json headRefName --jq '.headRefName')" >> "$GITHUB_ENV"
          echo "PR_HEAD_SHA=$(gh pr view "$number" --json headRefOid --jq '.headRefOid')" >> "$GITHUB_ENV"
          echo "PR_HEAD_REPO=$head_repo" >> "$GITHUB_ENV"

      - name: Checkout PR branch
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: |
          git fetch origin "${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}" "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          git checkout -B "$PR_HEAD_REF" "refs/remotes/origin/$PR_HEAD_REF"

      - name: Setup git identity
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: bun install --frozen-lockfile

      - name: Run deterministic Beepy PR review
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: bun run beepy:pr-review:auto

      - name: Show final git state
        if: ${{ always() }}
        run: git status --short --branch

      - name: Upload review trace
        if: ${{ always() && steps.resolve_pr.outputs.found == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: beepy-pr-review-trace
          path: potential/runs/*.pr-review.md
          retention-days: 1
