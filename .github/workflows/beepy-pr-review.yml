name: Beepy PR Review

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review. Leave blank to review the oldest open Beepy PR.
        required: false

concurrency:
  group: beepy-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_PROVIDER: kimi-for-coding
      KIMI_MODEL: k2p7
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCOUT_AGENT_TIMEOUT_MS: "300000"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        run: git fetch origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Beepy PR review
        run: bun run beepy:pr-review

      - name: Show final git state
        if: ${{ always() }}
        run: git status --short --branch

      - name: Upload review trace
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beepy-pr-review-trace
          path: potential/runs/*.pr-review.md

  review-open-beepy-pr:
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_PROVIDER: kimi-for-coding
      KIMI_MODEL: k2p7
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCOUT_AGENT_TIMEOUT_MS: "300000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Beepy PR
        id: resolve_pr
        run: |
          number="${{ inputs.pr_number }}"
          if [ -z "$number" ]; then
            number="$(gh pr list --state open --limit 30 --json number,author,isDraft,reviewDecision,labels,createdAt --jq '[.[] | select(.author.login == "app/github-actions" and (.isDraft | not) and (.reviewDecision != "APPROVED") and ((.labels | map(.name) | index("needs-human")) | not))] | sort_by(.createdAt) | .[0].number // ""')"
          fi

          if [ -z "$number" ]; then
            echo "No open Beepy PR needs review."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_repo="$(gh pr view "$number" --json headRepository --jq '.headRepository.nameWithOwner')"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR #$number comes from $head_repo, not $GITHUB_REPOSITORY; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"
          echo "PR_TITLE=$(gh pr view "$number" --json title --jq '.title')" >> "$GITHUB_ENV"
          echo "PR_URL=$(gh pr view "$number" --json url --jq '.url')" >> "$GITHUB_ENV"
          echo "PR_AUTHOR=$(gh pr view "$number" --json author --jq '.author.login')" >> "$GITHUB_ENV"
          echo "PR_BASE_REF=$(gh pr view "$number" --json baseRefName --jq '.baseRefName')" >> "$GITHUB_ENV"
          echo "PR_HEAD_REF=$(gh pr view "$number" --json headRefName --jq '.headRefName')" >> "$GITHUB_ENV"
          echo "PR_HEAD_SHA=$(gh pr view "$number" --json headRefOid --jq '.headRefOid')" >> "$GITHUB_ENV"
          echo "PR_HEAD_REPO=$head_repo" >> "$GITHUB_ENV"

      - name: Checkout PR branch
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: |
          git fetch origin "${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}" "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          git checkout -B "$PR_HEAD_REF" "refs/remotes/origin/$PR_HEAD_REF"

      - name: Setup git identity
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: bun install --frozen-lockfile

      - name: Classify review scope
        id: review_scope
        if: ${{ steps.resolve_pr.outputs.found == 'true' }}
        run: |
          changed_count="$(gh pr view "$PR_NUMBER" --json files --jq '.files | length')"
          echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"

          if [[ "$PR_HEAD_REF" == curator-scout/* ]] || [ "$changed_count" -gt 10 ]; then
            echo "autonomous=false" >> "$GITHUB_OUTPUT"
          else
            echo "autonomous=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deterministic large PR check
        if: ${{ steps.resolve_pr.outputs.found == 'true' && steps.review_scope.outputs.autonomous == 'false' }}
        run: |
          changed_count="$(gh pr view "$PR_NUMBER" --json files --jq '.files | length')"
          bun run typecheck
          bun run build
          bunx playwright install --with-deps chromium
          bun run smoke:browser

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Beepy skipped autonomous model review for this PR because it is a large curation/content diff (${PR_HEAD_REF}, ${changed_count} files changed). Large curator-scout PRs have been timing out in the model reviewer.

          Deterministic checks passed:
          - \`bun run typecheck\`
          - \`bun run build\`
          - \`bun run smoke:browser\`

          A human should still review the curation/source quality before merge.
          EOF
          gh label create needs-human --color ffcc00 --description "Requires Tobowers or external human action" || true
          gh pr edit "$PR_NUMBER" --add-label needs-human
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Run Beepy PR review
        if: ${{ steps.resolve_pr.outputs.found == 'true' && steps.review_scope.outputs.autonomous == 'true' }}
        run: bun run beepy:pr-review

      - name: Show final git state
        if: ${{ always() }}
        run: git status --short --branch

      - name: Upload review trace
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beepy-pr-review-trace
          path: potential/runs/*.pr-review.md
