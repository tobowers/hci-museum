name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Build static site
        run: bun run build

      - name: Browser smoke test
        run: bun run smoke:browser

      - name: Publish site
        id: publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          cname: interfacemuseum.com

      - name: Remove deployed Pages artifact
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r published_sha _ < <(git ls-remote origin refs/heads/gh-pages)
          if [ -z "$published_sha" ]; then
            echo "Could not resolve the published gh-pages commit."
            exit 1
          fi

          pages_run_id=""
          pages_status=""
          pages_conclusion=""
          for attempt in {1..120}; do
            runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=gh-pages&event=dynamic&per_page=10" 2>/dev/null || true)"
            pages_run_id="$(jq -r --arg sha "$published_sha" '[.workflow_runs[]? | select(.name == "pages build and deployment" and .head_sha == $sha)][0].id // empty' <<< "$runs_json")"
            pages_status="$(jq -r --arg sha "$published_sha" '[.workflow_runs[]? | select(.name == "pages build and deployment" and .head_sha == $sha)][0].status // empty' <<< "$runs_json")"
            pages_conclusion="$(jq -r --arg sha "$published_sha" '[.workflow_runs[]? | select(.name == "pages build and deployment" and .head_sha == $sha)][0].conclusion // empty' <<< "$runs_json")"
            if [ "$pages_status" = "completed" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$pages_run_id" ] || [ "$pages_status" != "completed" ]; then
            echo "Pages deployment did not complete for $published_sha."
            exit 1
          fi

          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pages_run_id/artifacts")"
          artifact_ids="$(jq -r '.artifacts[]?.id' <<< "$artifacts_json")"
          for artifact_id in $artifact_ids; do
            deleted=false
            for attempt in {1..6}; do
              if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; then
                deleted=true
                break
              fi
              sleep 5
            done
            if [ "$deleted" != "true" ]; then
              echo "Could not delete Pages artifact $artifact_id."
              exit 1
            fi
          done

          if [ "$pages_conclusion" != "success" ]; then
            echo "Pages deployment did not succeed for $published_sha."
            exit 1
          fi
