name: Beepy Manager

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  schedule:
    - cron: "12 13 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: Manager prompt
        required: true
        default: operate the HCI Museum, manage the GitHub issue backlog, and make one focused improvement
      agent_timeout_ms:
        description: Max time for the opencode manager run
        required: true
        default: "1800000"
      create_pr:
        description: Open a PR with generated file changes
        required: true
        type: boolean
        default: true

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_PROVIDER: kimi-for-coding
      KIMI_MODEL: k2p7
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCOUT_AGENT_TIMEOUT_MS: ${{ inputs.agent_timeout_ms || '1800000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run Beepy manager
        id: manager_run
        continue-on-error: true
        env:
          MANAGER_TOPIC: ${{ inputs.topic || 'operate the HCI Museum, manage the GitHub issue backlog, and make one focused improvement' }}
        run: bun run beepy:manager -- "$MANAGER_TOPIC"

      - name: Typecheck generated changes
        if: ${{ steps.manager_run.outcome == 'success' }}
        run: bun run typecheck

      - name: Build site with generated changes
        if: ${{ steps.manager_run.outcome == 'success' }}
        run: bun run build

      - name: Browser smoke test generated changes
        if: ${{ steps.manager_run.outcome == 'success' }}
        run: |
          bunx playwright install --with-deps chromium
          bun run smoke:browser

      - name: Show generated changes
        if: ${{ always() }}
        run: git status --short

      - name: Upload manager artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beepy-manager-output
          path: |
            docs/
            potential/runs/
            public/

      - name: Create manager pull request
        if: ${{ (github.event_name == 'schedule' || inputs.create_pr) && steps.manager_run.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: beepy-manager/${{ github.run_id }}
          delete-branch: true
          commit-message: Apply Beepy manager update
          title: "Beepy manager: ${{ inputs.topic || 'scheduled daily run' }}"
          body: |
            Automated Beepy manager output for `${{ inputs.topic || 'scheduled daily run' }}`.

            Review file changes and issue comments before merging.
          add-paths: |
            .github
            assets
            docs
            package.json
            scripts
            src
            tsconfig.json

      - name: Fail if manager failed
        if: ${{ steps.manager_run.outcome != 'success' }}
        run: exit 1
