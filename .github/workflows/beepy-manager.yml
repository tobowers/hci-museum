name: Beepy Manager

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  schedule:
    - cron: "12 13 * * *"
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      topic:
        description: Manager prompt
        required: true
        default: operate the HCI Museum, manage the GitHub issue backlog, and make one focused improvement
      agent_timeout_ms:
        description: Max time for the opencode manager run
        required: true
        default: "600000"
      create_pr:
        description: Open a PR with generated file changes
        required: true
        type: boolean
        default: true

concurrency:
  group: beepy-manager
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_PROVIDER: kimi-for-coding
      KIMI_MODEL: k2p7
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCOUT_AGENT_TIMEOUT_MS: ${{ inputs.agent_timeout_ms || '600000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode CLI
        run: bun add --global opencode-ai@1.17.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Resolve manager topic
        id: manager_topic
        env:
          DISPATCH_TOPIC: ${{ inputs.topic || '' }}
        run: |
          skip="false"
          source_issue=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            topic="$DISPATCH_TOPIC"
          elif [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            action="$(jq -r '.action' "$GITHUB_EVENT_PATH")"
            number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
            title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
            source_issue="$number"
            topic="Respond autonomously to issue #${number} (${action}): ${title}. Inspect the issue, acknowledge Tobowers if useful, classify it, and either act on one safe next step or clearly ask for the smallest human decision needed."
          elif [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            is_pr="$(jq -r '.issue.pull_request != null' "$GITHUB_EVENT_PATH")"
            author_type="$(jq -r '.comment.user.type' "$GITHUB_EVENT_PATH")"

            if [ "$is_pr" = "true" ] || [ "$author_type" = "Bot" ]; then
              skip="true"
              topic="skip bot or pull-request comment"
            else
              number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
              author="$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")"
              source_issue="$number"
              topic="Respond autonomously to @${author}'s latest comment on issue #${number}: ${title}. Read the full issue/comment thread with gh issue view before acting. Leave a direct issue reply unless the comment is duplicate/no-op, and either act on one safe next step or ask for the smallest human decision needed."
            fi
          else
            topic="scan all open GitHub issues, decide whether to comment or act, and make at most one focused improvement if appropriate"
          fi

          {
            echo "skip=$skip"
            echo "source_issue=$source_issue"
            echo "topic<<EOF"
            echo "$topic"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge source issue
        if: ${{ steps.manager_topic.outputs.skip != 'true' && steps.manager_topic.outputs.source_issue != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_ISSUE: ${{ steps.manager_topic.outputs.source_issue }}
        run: |
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Beepy saw this and started an autonomous pass on this thread.

          Run: $RUN_URL
          EOF
          gh issue comment "$SOURCE_ISSUE" --body-file "$body_file"

      - name: Run Beepy manager
        id: manager_run
        if: ${{ steps.manager_topic.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          MANAGER_TOPIC: ${{ steps.manager_topic.outputs.topic }}
        run: bun run beepy:manager -- "$MANAGER_TOPIC"

      - name: Typecheck generated changes
        id: generated_typecheck
        if: ${{ steps.manager_topic.outputs.skip != 'true' && steps.manager_run.outcome == 'success' }}
        run: bun run typecheck

      - name: Build site with generated changes
        id: generated_build
        if: ${{ steps.manager_topic.outputs.skip != 'true' && steps.manager_run.outcome == 'success' }}
        run: bun run build

      - name: Browser smoke test generated changes
        id: generated_smoke
        if: ${{ steps.manager_topic.outputs.skip != 'true' && steps.manager_run.outcome == 'success' }}
        continue-on-error: true
        run: |
          bunx playwright install --with-deps chromium
          bun run smoke:browser

      - name: Report smoke failure issue
        if: ${{ steps.generated_smoke.outcome == 'failure' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create beepy --color 2f81f7 --description "Automated Beepy work" || true
          gh label create qa --color d29922 --description "Quality assurance" || true
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          The Beepy manager run hit a browser smoke-test failure after the manager completed.

          Run: $RUN_URL

          This does not necessarily mean Beepy's focused change caused the failure; broken images can pre-exist the run. Review the action log for the exact page/image and either fix the asset or close this issue if a newer run has already resolved it.
          EOF
          issue_number="$(gh issue list --state open --search "Beepy manager smoke test is failing in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
            gh issue view "$issue_number" --json number,title,state,url
          else
            created_issue="$(gh issue create --title "Beepy manager smoke test is failing" --body-file "$body_file" --label beepy --label qa || \
              gh issue create --title "Beepy manager smoke test is failing" --body-file "$body_file")"
            gh issue view "$created_issue" --json number,title,state,url
          fi

      - name: Show generated changes
        if: ${{ always() }}
        run: git status --short

      - name: Report manager failure to source issue
        if: ${{ steps.manager_topic.outputs.skip != 'true' && steps.manager_topic.outputs.source_issue != '' && steps.manager_run.outcome != 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_ISSUE: ${{ steps.manager_topic.outputs.source_issue }}
        run: |
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Beepy's autonomous model pass did not finish cleanly, so I am leaving the failure signal here instead of going silent.

          Run: $RUN_URL

          The issue/comment trigger is active; the model step timed out or failed before it could complete the work. A later run can continue from this thread.
          EOF
          gh issue comment "$SOURCE_ISSUE" --body-file "$body_file"

      - name: Upload manager artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beepy-manager-output
          path: |
            docs/
            potential/runs/
            public/

      - name: Create manager pull request
        if: ${{ steps.manager_topic.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'issues' || github.event_name == 'issue_comment' || inputs.create_pr) && steps.manager_run.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: beepy-manager/${{ github.run_id }}
          delete-branch: true
          commit-message: Apply Beepy manager update
          title: "Beepy manager: ${{ steps.manager_topic.outputs.topic }}"
          body: |
            Automated Beepy manager output for `${{ steps.manager_topic.outputs.topic }}`.

            Validation:
            - Typecheck: `${{ steps.generated_typecheck.outcome }}`
            - Build: `${{ steps.generated_build.outcome }}`
            - Browser smoke: `${{ steps.generated_smoke.outcome }}`

            If browser smoke failed, Beepy may still have produced useful issue/backlog or file changes. Review the linked QA issue and action log before merging.

            Review file changes and issue comments before merging.
          add-paths: |
            .github
            assets
            docs
            package.json
            scripts
            src
            tsconfig.json

      - name: Fail if manager failed
        if: ${{ steps.manager_topic.outputs.skip != 'true' && steps.manager_topic.outputs.source_issue == '' && steps.manager_run.outcome != 'success' }}
        run: exit 1
